<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI CIA — 免费 AI Token 与模型额度情报。独立核验，持续更新。" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://aicia.pages.dev/" />
  <title>AI CIA · 免费 AI Token 情报</title>
  <link rel="stylesheet" href="style.css?v=__VERSION__" />
</head>
<body>

  <header class="topnav">
    <div class="wrap topnav-inner">
      <a class="brand" href="#top">AI CIA</a>
      <nav aria-label="主导航">
        <a href="#list">情报</a>
        <a href="#watchout">观望名单</a>
        <a href="/submit.html">投稿</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 情报列表 -->
    <section class="section" id="list">
      <div class="wrap">
        <div class="section-head">
          <h2>情报列表</h2>
          <span class="section-note" id="list-total">—</span>
        </div>
        <div class="toolbar" id="filters">
          <div class="filters">
            <button type="button" data-type="all" class="active">全部</button>
            <button type="button" data-type="大模型">大模型</button>
            <button type="button" data-type="工具">工具</button>
          </div>
          <input type="search" id="searchInput" class="search-input" placeholder="搜索平台、模型、额度…" />
          <select id="sortSelect" class="sort-select">
            <option value="updated">按更新时间</option>
            <option value="name">按名称 A-Z</option>
          </select>
        </div>
        <div class="cards" id="cards">
          <!-- STATIC_CARDS -->
        </div>
      </div>
    </section>

    <!-- 观望名单 -->
    <section class="section watchout-section" id="watchout">
      <div class="wrap">
        <div class="section-head">
          <h2>观望名单</h2>
          <span class="section-note">暂不建议优先领取</span>
        </div>
        <div id="watchout-cards">
          <!-- STATIC_WATCHOUT -->
        </div>
      </div>
    </section>

    <!-- 投稿 -->
    <section class="section submit-section" id="submit">
      <div class="wrap submit-inner">
        <h2>发现新额度？</h2>
        <p>填一张表，我们核实后整理入库。不需要账号。</p>
        <a class="cta" href="/submit.html">去投稿 →</a>
      </div>
    </section>
    <!-- 底部介绍（参考 token-fbi 风格） -->
    <section class="section intro-section" id="about">
      <div class="wrap intro-grid">
        <!-- 左栏 -->
        <div class="intro-left">
          <h2>把值得领取的<br><em>AI 额度</em>放在一处。</h2>
          <p class="intro-dek">额度、模型、领取方式和实测判断，一次查清。</p>
          <div class="intro-buttons">
            <a class="cta" href="#list">查看情报</a>
            <a class="btn-outline" href="/submit.html">提交一条新线索</a>
          </div>
          <div class="stats-cards">
            <div class="stat-card"><span class="stat-label">大模型</span><span class="stat-num" id="stat-models">—</span></div>
            <div class="stat-card"><span class="stat-label">工具</span><span class="stat-num" id="stat-tools">—</span></div>
            <div class="stat-card"><span class="stat-label">限时活动</span><span class="stat-num" id="stat-limited">—</span></div>
            <div class="stat-card"><span class="stat-label">最后更新</span><span class="stat-num stat-date" id="stat-updated">—</span></div>
          </div>
        </div>
        <!-- 右栏：精选模型 -->
        <div class="intro-right">
          <h3 class="criteria-title">优先收录能直接调用<br>前沿模型的平台</h3>
          <span class="badge-outline">精选门槛</span>
          <ul class="featured-grid" id="featured-models">
            <!-- FEATURED_MODELS -->
          </ul>
          <p class="intro-note">多模态与高价值聚合平台，也会持续核验收录。</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>AI CIA · 非官方爱好者情报站</span>
      <span class="footer-mono">aicia.pages.dev</span>
    </div>
  </footer>

  <script defer src="app.js?v=__VERSION__"></script>
</body>
</html>
