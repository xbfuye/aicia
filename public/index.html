<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI CIA — 免费 AI Token 与模型额度情报。独立核验，持续更新。" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://aicia.pages.dev/" />
  <title>AI CIA · 免费 AI Token 情报</title>
  <link rel="stylesheet" href="style.css?v=__VERSION__" />
</head>
<body>

  <!-- 报头：像报纸的刊号行 -->
  <div class="masthead-rule" aria-hidden="true"></div>
  <div class="masthead">
    <div class="wrap masthead-inner">
      <span class="masthead-left">内部参考 · 第 <b id="issue-no">2026.09</b> 期</span>
      <span class="masthead-center">A I &nbsp; C I A</span>
      <span class="masthead-right">独立核验 · 不收暗广</span>
    </div>
  </div>
  <div class="masthead-rule" aria-hidden="true"></div>

  <header class="topnav">
    <div class="wrap topnav-inner">
      <a class="brand" href="#top">AI CIA</a>
      <nav aria-label="主导航">
        <a href="#list">情报</a>
        <a href="#watchout">观望名单</a>
        <a href="/submit.html">投稿</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 头版 -->
    <section class="lead" id="top">
      <div class="wrap lead-inner">
        <h1>把还能免费领的<br><em>AI 额度</em>，列在一张纸上。</h1>
        <p class="dek">每家大模型送多少、怎么领、实测好不好用——独立核实，不接暗广。</p>

        <div class="meta-row" aria-label="本站数据">
          <div class="meta-item"><span class="meta-label">在录</span><span class="meta-num" id="stat-models">—</span><span class="meta-unit">大模型</span></div>
          <div class="meta-item"><span class="meta-label">在录</span><span class="meta-num" id="stat-tools">—</span><span class="meta-unit">工具</span></div>
          <div class="meta-item"><span class="meta-label">限时</span><span class="meta-num" id="stat-limited">—</span><span class="meta-unit">项</span></div>
          <div class="meta-item"><span class="meta-label">更新</span><span class="meta-num mono" id="stat-updated">—</span></div>
        </div>

        <aside class="criteria">
          <h2 class="criteria-title">编辑方针</h2>
          <p class="criteria-lede">只收录能直接调用以下前沿模型的平台。同系列更高版本自动收录，旧代际不入目。</p>
          <ul class="criteria-list" id="featured-models">
            <!-- FEATURED_MODELS -->
          </ul>
        </aside>
      </div>
    </section>

    <!-- 情报列表 -->
    <section class="section" id="list">
      <div class="wrap">
        <div class="section-head">
          <h2>情报列表</h2>
          <span class="section-note" id="list-total">—</span>
        </div>
        <div class="filters" id="filters" role="group" aria-label="按类别筛选">
          <button type="button" data-type="all" class="active">全部</button>
          <button type="button" data-type="大模型">大模型</button>
          <button type="button" data-type="工具">工具</button>
        </div>
        <input type="search" id="searchInput" class="search-input" placeholder="搜索平台、模型、额度…" />
        <div class="cards" id="cards">
          <!-- STATIC_CARDS -->
        </div>
      </div>
    </section>

    <!-- 观望名单 -->
    <section class="section watchout-section" id="watchout">
      <div class="wrap">
        <div class="section-head">
          <h2>观望名单</h2>
          <span class="section-note">暂不建议优先领取</span>
        </div>
        <div id="watchout-cards">
          <!-- STATIC_WATCHOUT -->
        </div>
      </div>
    </section>

    <!-- 投稿 -->
    <section class="section submit-section" id="submit">
      <div class="wrap submit-inner">
        <h2>发现新额度？</h2>
        <p>填一张表，我们核实后整理入库。不需要账号。</p>
        <a class="cta" href="/submit.html">去投稿 →</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>AI CIA · 非官方爱好者情报站</span>
      <span class="footer-mono">aicia.pages.dev</span>
    </div>
  </footer>

  <script defer src="app.js?v=__VERSION__"></script>
</body>
</html>
